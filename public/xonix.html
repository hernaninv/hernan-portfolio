<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xonix | Hernan Aronson</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none;
        }
        #hud {
            display: flex;
            justify-content: space-between;
            width: 800px;
            padding: 8px 4px;
            color: white;
            font-size: 15px;
            font-weight: bold;
        }
        #pct-label {
            width: 800px;
            text-align: center;
            color: #87ceeb;
            font-size: 12px;
            margin-bottom: 3px;
        }
        #progress-bar {
            width: 800px;
            height: 8px;
            background: rgba(255,255,255,0.12);
            border-radius: 4px;
            margin-bottom: 5px;
            overflow: hidden;
            position: relative;
        }
        #progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00bfff, #1e90ff);
            border-radius: 4px;
            width: 0%;
            transition: width 0.12s;
        }
        canvas {
            display: block;
            border: 3px solid #1a4fff;
            box-shadow: 0 0 40px rgba(26,79,255,0.5);
        }

        /* ── Mobile controls ─────────────────────────────────────── */
        #mobile-controls {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            padding-bottom: 24px;
        }

        .mob-row { display: flex; gap: 10px; }

        .mob-btn {
            width: 68px;
            height: 68px;
            background: rgba(255,255,255,0.12);
            border: 1.5px solid rgba(255,255,255,0.28);
            border-radius: 16px;
            color: white;
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.08s;
        }

        .mob-btn.pressed { background: rgba(255,255,255,0.34); }

        .mob-btn-start {
            width: 220px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1.5px;
            background: rgba(26,79,255,0.35);
            border-color: rgba(26,79,255,0.7);
        }

        .mob-btn-center {
            background: transparent;
            border-color: transparent;
            pointer-events: none;
        }

        @media (max-width: 820px) {
            body { justify-content: flex-start; overflow-y: auto; padding-top: 16px; }
            #mobile-controls { display: flex; }
        }
    </style>
</head>
<body>

<div id="game-wrap">
    <div id="hud">
        <span id="h-lives">❤️ Vidas: 3</span>
        <span id="h-level">Nivel 1</span>
        <span id="h-score">Puntaje: 0</span>
    </div>
    <div id="pct-label">0.0% conquistado — meta: 75%</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <canvas id="c"></canvas>
</div>

<!-- Mobile touch controls -->
<div id="mobile-controls">
    <div class="mob-row">
        <div class="mob-btn mob-btn-center"></div>
        <button class="mob-btn" id="mb-up">↑</button>
        <div class="mob-btn mob-btn-center"></div>
    </div>
    <div class="mob-row">
        <button class="mob-btn" id="mb-left">←</button>
        <div class="mob-btn mob-btn-center"></div>
        <button class="mob-btn" id="mb-right">→</button>
    </div>
    <div class="mob-row">
        <div class="mob-btn mob-btn-center"></div>
        <button class="mob-btn" id="mb-down">↓</button>
        <div class="mob-btn mob-btn-center"></div>
    </div>
    <div class="mob-row">
        <button class="mob-btn mob-btn-start" id="mb-enter">▶ JUGAR / CONTINUAR</button>
    </div>
</div>

<script>
const C   = document.getElementById('c');
const ctx = C.getContext('2d');

const COLS = 80, ROWS = 60, SZ = 10;
C.width  = COLS * SZ;   // 800
C.height = ROWS * SZ;   // 600

const EMPTY = 0, BORDER = 1, TRAIL = 2, FILLED = 3;
const TOTAL_INNER = (COLS - 2) * (ROWS - 2);  // 4524
const FILL_TARGET = 0.75;

const COL_EMPTY  = '#ffffff';
const COL_BORDER = '#1a4fff';
const COL_TRAIL  = '#ff8c00';
const COL_FILLED = '#87ceeb';

let grid, player, enemies, lives, score, level, state, filledCount;
const keys = {};
let moveTimer = 0;
const MOVE_INTERVAL = 5;  // frames between player steps (~12 steps/sec at 60fps)

// ── Grid ──────────────────────────────────────────────────────────────────────

function initGrid() {
    grid = Array.from({ length: ROWS }, (_, r) =>
        Array.from({ length: COLS }, (_, c) =>
            (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1) ? BORDER : EMPTY
        )
    );
    filledCount = 0;
}

function getFilledPct() { return filledCount / TOTAL_INNER; }

// ── Level setup ───────────────────────────────────────────────────────────────

function spawnEnemies() {
    enemies = [];
    const count = 2 + (level - 1);
    const speed = 1.3 + (level - 1) * 0.22;
    for (let i = 0; i < count; i++) {
        const col = 8 + Math.floor(Math.random() * (COLS - 16));
        const row = 8 + Math.floor(Math.random() * (ROWS - 16));
        const angle = Math.random() * Math.PI * 2;
        enemies.push({
            px: col * SZ + SZ / 2,
            py: row * SZ + SZ / 2,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            r: SZ * 0.82 / 2,
        });
    }
}

function startLevel() {
    initGrid();
    player = { x: Math.floor(COLS / 2), y: 0, trailing: false };
    spawnEnemies();
    moveTimer = 0;
}

function startGame() {
    lives = 3; score = 0; level = 1;
    startLevel();
    state = 'playing';
    updateHUD();
}

// ── Fill (flood fill from enemies) ────────────────────────────────────────────

function closeTrail() {
    const reachable = new Uint8Array(ROWS * COLS);
    const stack = [];

    for (const e of enemies) {
        const ec = Math.floor(e.px / SZ);
        const er = Math.floor(e.py / SZ);
        const idx = er * COLS + ec;
        if (er > 0 && er < ROWS && ec > 0 && ec < COLS &&
            grid[er][ec] === EMPTY && !reachable[idx]) {
            reachable[idx] = 1;
            stack.push(idx);
        }
    }

    while (stack.length) {
        const idx = stack.pop();
        const r = (idx / COLS) | 0, c = idx % COLS;
        for (const ni of [idx - COLS, idx + COLS, idx - 1, idx + 1]) {
            if (ni < 0 || ni >= ROWS * COLS || reachable[ni]) continue;
            const nr = (ni / COLS) | 0, nc = ni % COLS;
            if (grid[nr][nc] === EMPTY) { reachable[ni] = 1; stack.push(ni); }
        }
    }

    let gained = 0;
    for (let r = 1; r < ROWS - 1; r++)
        for (let c = 1; c < COLS - 1; c++) {
            const cell = grid[r][c];
            if (cell === TRAIL || (cell === EMPTY && !reachable[r * COLS + c])) {
                grid[r][c] = FILLED;
                gained++;
            }
        }

    filledCount += gained;
    score += gained * 10 * level;
    updateHUD();
    if (getFilledPct() >= FILL_TARGET) state = 'levelcomplete';
}

// ── Player movement ───────────────────────────────────────────────────────────

function movePlayer() {
    if (state !== 'playing') return;
    if (++moveTimer < MOVE_INTERVAL) return;
    moveTimer = 0;

    let dx = 0, dy = 0;
    if      (keys['ArrowLeft'])  dx = -1;
    else if (keys['ArrowRight']) dx =  1;
    else if (keys['ArrowUp'])    dy = -1;
    else if (keys['ArrowDown'])  dy =  1;
    if (!dx && !dy) return;

    const nx = player.x + dx, ny = player.y + dy;
    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return;

    const target = grid[ny][nx];
    if (target === TRAIL) return;

    if (target === EMPTY) {
        grid[ny][nx] = TRAIL;
        player.x = nx; player.y = ny;
        player.trailing = true;
    } else if (target === BORDER || target === FILLED) {
        if (player.trailing) {
            player.x = nx; player.y = ny;
            closeTrail();
            player.trailing = false;
        } else {
            player.x = nx; player.y = ny;
        }
    }
}

// ── Enemy movement ────────────────────────────────────────────────────────────

function hitsSolid(px, py, rad) {
    const cl = Math.floor((px - rad) / SZ);
    const cr = Math.floor((px + rad - 0.01) / SZ);
    const ct = Math.floor((py - rad) / SZ);
    const cb = Math.floor((py + rad - 0.01) / SZ);
    for (let r = ct; r <= cb; r++)
        for (let c = cl; c <= cr; c++) {
            if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return true;
            const cell = grid[r][c];
            if (cell === BORDER || cell === FILLED) return true;
        }
    return false;
}

function moveEnemies() {
    if (state !== 'playing') return;
    for (const e of enemies) {
        const nx = e.px + e.vx;
        if (hitsSolid(nx, e.py, e.r)) e.vx = -e.vx; else e.px = nx;
        const ny = e.py + e.vy;
        if (hitsSolid(e.px, ny, e.r)) e.vy = -e.vy; else e.py = ny;
    }
}

// ── Collision: enemy touches trail ────────────────────────────────────────────

function hitsTrail(px, py, rad) {
    const cl = Math.floor((px - rad) / SZ);
    const cr = Math.floor((px + rad - 0.01) / SZ);
    const ct = Math.floor((py - rad) / SZ);
    const cb = Math.floor((py + rad - 0.01) / SZ);
    for (let r = ct; r <= cb; r++)
        for (let c = cl; c <= cr; c++) {
            if (c < 0 || c >= COLS || r < 0 || r >= ROWS) continue;
            if (grid[r][c] === TRAIL) return true;
        }
    return false;
}

function checkDeaths() {
    if (!player.trailing) return;
    for (const e of enemies)
        if (hitsTrail(e.px, e.py, e.r)) { killPlayer(); return; }
}

function killPlayer() {
    for (let r = 1; r < ROWS - 1; r++)
        for (let c = 1; c < COLS - 1; c++)
            if (grid[r][c] === TRAIL) grid[r][c] = EMPTY;
    lives--;
    player.x = Math.floor(COLS / 2); player.y = 0; player.trailing = false;
    if (lives <= 0) state = 'gameover';
    updateHUD();
}

// ── Drawing ───────────────────────────────────────────────────────────────────

function drawGrid() {
    for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++) {
            switch (grid[r][c]) {
                case EMPTY:  ctx.fillStyle = COL_EMPTY;  break;
                case BORDER: ctx.fillStyle = COL_BORDER; break;
                case TRAIL:  ctx.fillStyle = COL_TRAIL;  break;
                case FILLED: ctx.fillStyle = COL_FILLED; break;
            }
            ctx.fillRect(c * SZ, r * SZ, SZ, SZ);
        }

    // "Hernan" — clipped to filled cells only
    if (filledCount > 0) {
        ctx.save();
        ctx.beginPath();
        for (let r = 1; r < ROWS - 1; r++) {
            let s = -1;
            for (let c = 1; c < COLS - 1; c++) {
                if (grid[r][c] === FILLED) { if (s < 0) s = c; }
                else { if (s >= 0) { ctx.rect(s * SZ, r * SZ, (c - s) * SZ, SZ); s = -1; } }
            }
            if (s >= 0) ctx.rect(s * SZ, r * SZ, (COLS - 1 - s) * SZ, SZ);
        }
        ctx.clip();
        ctx.font = 'bold 110px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(20, 80, 190, 0.28)';
        ctx.fillText('Hernan', C.width / 2, C.height / 2);
        ctx.restore();
    }
}

function drawSoccerBall(cx, cy, rad) {
    const g = ctx.createRadialGradient(cx - rad * 0.3, cy - rad * 0.3, rad * 0.05, cx, cy, rad);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#cccccc');
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = '#333'; ctx.lineWidth = 0.7; ctx.stroke();

    // center pentagon
    const p = rad * 0.36;
    ctx.beginPath(); ctx.fillStyle = '#111';
    for (let i = 0; i < 5; i++) {
        const a = i * 2 * Math.PI / 5 - Math.PI / 2;
        i === 0 ? ctx.moveTo(cx + Math.cos(a)*p, cy + Math.sin(a)*p)
                : ctx.lineTo(cx + Math.cos(a)*p, cy + Math.sin(a)*p);
    }
    ctx.closePath(); ctx.fill();

    // 5 outer patches
    for (let i = 0; i < 5; i++) {
        const a  = i * 2 * Math.PI / 5 - Math.PI / 2;
        const ox = cx + Math.cos(a) * rad * 0.67;
        const oy = cy + Math.sin(a) * rad * 0.67;
        const pr = rad * 0.26;
        ctx.beginPath(); ctx.fillStyle = '#111';
        for (let j = 0; j < 5; j++) {
            const a2 = j * 2 * Math.PI / 5 + a + Math.PI / 10;
            j === 0 ? ctx.moveTo(ox + Math.cos(a2)*pr, oy + Math.sin(a2)*pr)
                    : ctx.lineTo(ox + Math.cos(a2)*pr, oy + Math.sin(a2)*pr);
        }
        ctx.closePath(); ctx.fill();
    }
}

function drawBasketball(cx, cy, rad) {
    const g = ctx.createRadialGradient(cx - rad*0.3, cy - rad*0.35, rad*0.1, cx, cy, rad);
    g.addColorStop(0, '#f5a030'); g.addColorStop(1, '#c04000');
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.fillStyle = g; ctx.fill();

    ctx.strokeStyle = 'rgba(55,15,0,0.85)';
    ctx.lineWidth = rad * 0.14; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(cx, cy - rad + 1); ctx.lineTo(cx, cy + rad - 1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - rad + 1, cy); ctx.lineTo(cx + rad - 1, cy); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx - rad*0.5, cy, rad*0.8, -0.58, 0.58); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + rad*0.5, cy, rad*0.8, Math.PI-0.58, Math.PI+0.58); ctx.stroke();

    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(55,15,0,0.7)'; ctx.lineWidth = 0.8; ctx.stroke();
}

function drawOverlay(title, sub, hint) {
    ctx.fillStyle = 'rgba(0,0,0,0.76)';
    ctx.fillRect(0, 0, C.width, C.height);
    ctx.textAlign = 'center';
    ctx.font = 'bold 52px Arial'; ctx.fillStyle = '#fff';
    ctx.fillText(title, C.width/2, C.height/2 - 55);
    ctx.font = '21px Arial'; ctx.fillStyle = '#87ceeb';
    ctx.fillText(sub, C.width/2, C.height/2 + 5);
    ctx.font = '15px Arial'; ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText(hint, C.width/2, C.height/2 + 45);
}

function render() {
    ctx.clearRect(0, 0, C.width, C.height);
    drawGrid();
    enemies.forEach(e => drawBasketball(e.px, e.py, e.r));
    drawSoccerBall(player.x * SZ + SZ/2, player.y * SZ + SZ/2, SZ * 0.84 / 2);

    const pct = getFilledPct();
    document.getElementById('progress-fill').style.width =
        Math.min(pct / FILL_TARGET, 1) * 100 + '%';
    document.getElementById('pct-label').textContent =
        `${(pct*100).toFixed(1)}% conquistado — meta: 75%`;

    if (state === 'menu')
        drawOverlay('XONIX',
            'Encerrá zonas con tu rastro — esquivá las pelotas de básquet',
            'ENTER / botón ▶ para jugar  ·  Flechas para mover');
    else if (state === 'gameover')
        drawOverlay('GAME OVER',
            `Puntaje final: ${score.toLocaleString()}`,
            'ENTER para reiniciar');
    else if (state === 'levelcomplete')
        drawOverlay(`¡Nivel ${level} superado!`,
            `Conquistaste el ${(pct*100).toFixed(1)}%  —  Puntaje: ${score.toLocaleString()}`,
            'ENTER para continuar');
}

// ── HUD ───────────────────────────────────────────────────────────────────────

function updateHUD() {
    document.getElementById('h-lives').textContent = '❤️ Vidas: ' + lives;
    document.getElementById('h-level').textContent = 'Nivel ' + level;
    document.getElementById('h-score').textContent = 'Puntaje: ' + score.toLocaleString();
}

// ── Game loop ─────────────────────────────────────────────────────────────────

function tick() {
    movePlayer();
    moveEnemies();
    checkDeaths();
    render();
    requestAnimationFrame(tick);
}

// ── Input ─────────────────────────────────────────────────────────────────────

document.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))
        e.preventDefault();
    if (e.key === 'Enter') {
        if (state === 'menu' || state === 'gameover') {
            startGame();
        } else if (state === 'levelcomplete') {
            level++; startLevel(); state = 'playing'; updateHUD();
        }
    }
});
document.addEventListener('keyup', e => { delete keys[e.key]; });

// ── Boot ──────────────────────────────────────────────────────────────────────

lives = 3; score = 0; level = 1; state = 'menu';
initGrid();
player   = { x: Math.floor(COLS/2), y: 0, trailing: false };
enemies  = [];
updateHUD();
requestAnimationFrame(tick);

// ── Mobile touch controls ─────────────────────────────────────────────────────

function dirBtn(id, key) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; el.classList.add('pressed'); }, { passive: false });
    const release = () => { delete keys[key]; el.classList.remove('pressed'); };
    el.addEventListener('touchend', release);
    el.addEventListener('touchcancel', release);
}

dirBtn('mb-up',    'ArrowUp');
dirBtn('mb-down',  'ArrowDown');
dirBtn('mb-left',  'ArrowLeft');
dirBtn('mb-right', 'ArrowRight');

const mbEnter = document.getElementById('mb-enter');
if (mbEnter) {
    mbEnter.addEventListener('touchstart', e => {
        e.preventDefault();
        mbEnter.classList.add('pressed');
        if (state === 'menu' || state === 'gameover') {
            startGame();
        } else if (state === 'levelcomplete') {
            level++; startLevel(); state = 'playing'; updateHUD();
        }
    }, { passive: false });
    mbEnter.addEventListener('touchend', () => mbEnter.classList.remove('pressed'));
}

// ── Responsive scale ──────────────────────────────────────────────────────────

function applyScale() {
    const wrap = document.getElementById('game-wrap');
    const available = window.innerWidth - 16;
    wrap.style.zoom = Math.min(1, available / 800);
}
window.addEventListener('resize', applyScale);
applyScale();
</script>
</body>
</html>
